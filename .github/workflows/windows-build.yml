name: Windows Build

on:
  push:
    branches:
      - build/windows-exe

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - run: npm ci

      - name: Build Windows installer
        run: npm run build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: Origin-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/origin.exe
          if-no-files-found: error
          retention-days: 30
